<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: mesmo desenho do logo da Sidebar (event_repeat sobre o primary).
         PNG de 32px para navegador sem suporte a SVG; o apple-touch-icon é o
         ícone de "Adicionar à Tela de Início" no iPhone. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#131318" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rotina</title>
    <!-- Fontes (Inter + Material Symbols) self-hosted via npm em src/main.tsx;
         servidas pela mesma origem para respeitar o CSP estrito (font-src 'self').
         A dos ícones é um subset instanciado em wght=400 (src/index.css). -->
    <style>
      .material-symbols-outlined {
        /* Só FILL: wght, GRAD e opsz foram fixados dentro da própria fonte pelo
           scripts/subset-icons.mjs, então declará-los aqui não teria efeito. */
        font-variation-settings: 'FILL' 0;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
